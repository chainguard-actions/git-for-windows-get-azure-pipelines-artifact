name: Test basic artifact download
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          repository: git-for-windows/git
          definitionId: '1'
          artifact: ''
          path: /tmp/azure-artifact-output
          cache: 'false'
        continue-on-error: true
      - name: Assert action ran (success or expected API failure)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          # The action may fail due to no matching build or network issues,
          # but it should not crash with an unhandled exception at startup.
          # We accept both success and failure outcomes here since this is
          # an external API call that may not return results in CI.
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action completed with outcome '$OUTCOME'"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
