name: Test reasonFilter parameter with invalid pipeline
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with reasonFilter set (expect failure on invalid repo)
        id: action
        uses: .
        continue-on-error: true
        with:
          repository: this-org-does-not-exist-xyz123/this-repo-does-not-exist-xyz123
          definitionId: '99999'
          artifact: nonexistent-artifact
          reasonFilter: 'manual'
          cache: 'false'
          verbose: 'true'

      - name: Assert action failed (invalid repo, reasonFilter=manual)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid repository and reasonFilter=manual, but got outcome '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed for invalid repository with reasonFilter=manual"
