name: Test reasonFilter input with Azure Pipeline download
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        name: Download artifact with reasonFilter=individualCI
        uses: .
        with:
          repository: git/git
          definitionId: '10'
          artifact: sparse
          path: filtered-artifact
          cache: 'false'
          reasonFilter: 'individualCI'
          verbose: 'true'
        continue-on-error: true

      - name: Assert action completed (success or expected failure)
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          # The action may succeed (if individualCI builds exist) or fail
          # (if no individualCI builds exist for this pipeline).
          # Either way, the action should not crash unexpectedly.
          if [ "${{ steps.action.outcome }}" = "success" ]; then
            echo "Action succeeded - checking artifact directory..."
            if [ ! -d "filtered-artifact" ]; then
              echo "FAIL: action succeeded but artifact directory not found"
              exit 1
            fi
            FILE_COUNT=$(find filtered-artifact -type f | wc -l)
            echo "File count: $FILE_COUNT"
            if [ "$FILE_COUNT" -lt 1 ]; then
              echo "FAIL: expected at least one file in filtered-artifact"
              exit 1
            fi
            echo "PASS: $FILE_COUNT file(s) downloaded with reasonFilter=individualCI"
          elif [ "${{ steps.action.outcome }}" = "failure" ]; then
            echo "PASS: action failed gracefully (no individualCI builds found or API error)"
          else
            echo "FAIL: unexpected outcome: ${{ steps.action.outcome }}"
            exit 1
          fi
