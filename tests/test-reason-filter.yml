name: Test reasonFilter and cache inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          repository: git/git
          definitionId: 10
          artifact: sparse
          path: sparse-filtered
          cache: 'false'
          reasonFilter: 'individualCI'
      - name: Assert action ran with reasonFilter
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            if [ ! -d "sparse-filtered" ]; then
              echo "FAIL: output directory 'sparse-filtered' does not exist after success"
              exit 1
            fi
            FILE_COUNT=$(find sparse-filtered -type f | wc -l)
            echo "Files found: $FILE_COUNT"
            if [ "$FILE_COUNT" -lt 1 ]; then
              echo "FAIL: expected at least one file in sparse-filtered, found $FILE_COUNT"
              exit 1
            fi
            echo "PASS: artifact downloaded with reasonFilter=individualCI, $FILE_COUNT file(s)"
          else
            echo "INFO: action did not succeed (outcome=$OUTCOME)"
            echo "INFO: Azure DevOps pipeline may have no individualCI builds or API unavailable"
            echo "PASS"
          fi
