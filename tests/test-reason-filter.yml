name: Test reasonFilter option
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create output directory
        run: mkdir -p /tmp/artifact-reason-filter
      - id: action
        uses: .
        with:
          repository: git-for-windows/git
          definitionId: '1'
          path: /tmp/artifact-reason-filter
          verbose: 'false'
          cache: 'false'
          reasonFilter: 'individualCI'
        continue-on-error: true
      - name: Assert action ran with reasonFilter
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          # The action should run (not be cancelled) regardless of whether
          # builds matching the filter are found
          if [ "$OUTCOME" = "cancelled" ]; then
            echo "FAIL: action was cancelled unexpectedly"
            exit 1
          fi
          echo "PASS: action completed with reasonFilter=individualCI, outcome=$OUTCOME"
