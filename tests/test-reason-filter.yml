name: Test reasonFilter parameter validation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          repository: 'some-org/some-repo'
          definitionId: ''
          artifact: sparse
          path: sparse-filtered
          cache: 'false'
          reasonFilter: 'all'
        continue-on-error: true
      - name: Assert action failed with empty definitionId
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with empty definitionId, but got outcome '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed when definitionId is empty"
