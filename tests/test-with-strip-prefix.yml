name: Test with stripPrefix input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          repository: git-for-windows/git
          definitionId: '1'
          artifact: Git-build-artifacts
          stripPrefix: 'Git-build-artifacts/'
          path: /tmp/azure-artifact-strip-prefix
          cache: 'false'
        continue-on-error: true
      - name: Assert action ran with stripPrefix input
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          # The action may fail due to network/API access in test environment,
          # but we verify it was invoked with the stripPrefix input (not a missing-input error).
          # A missing required input would cause a different kind of failure.
          if [ "${{ steps.action.outcome }}" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action was invoked with stripPrefix input"
