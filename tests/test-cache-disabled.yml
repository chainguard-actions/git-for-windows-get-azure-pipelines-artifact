name: Test with cache disabled (invalid pipeline, error path)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with cache disabled and invalid pipeline (expect failure)
        id: action
        uses: .
        with:
          repository: nonexistent-org/nonexistent-repo
          definitionId: '1'
          cache: 'false'
          verbose: 'true'
        continue-on-error: true

      - name: Assert action failed as expected with cache disabled
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid pipeline (cache=false), but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed for non-existent pipeline with cache disabled"
