name: Test real artifact download from Azure Pipeline
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        name: Download sparse artifact from git/git Azure Pipeline
        uses: .
        with:
          repository: git/git
          definitionId: '10'
          artifact: sparse
          path: downloaded-artifact
          cache: 'false'
        continue-on-error: true

      - name: Assert action completed with expected outcome
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" = "success" ]; then
            echo "Action succeeded - checking artifact directory..."
            if [ ! -d "downloaded-artifact" ]; then
              echo "FAIL: action succeeded but artifact directory not found"
              exit 1
            fi
            FILE_COUNT=$(find downloaded-artifact -type f | wc -l)
            echo "File count: $FILE_COUNT"
            if [ "$FILE_COUNT" -lt 1 ]; then
              echo "FAIL: expected at least one file in downloaded-artifact"
              exit 1
            fi
            echo "PASS: $FILE_COUNT file(s) downloaded successfully"
          elif [ "${{ steps.action.outcome }}" = "failure" ]; then
            # The pipeline may have no recent successful builds or the artifact
            # may have changed - this is an acceptable outcome for a live API test
            echo "PASS: action failed gracefully (pipeline may have no recent builds or artifact unavailable)"
          else
            echo "FAIL: unexpected outcome: ${{ steps.action.outcome }}"
            exit 1
          fi
