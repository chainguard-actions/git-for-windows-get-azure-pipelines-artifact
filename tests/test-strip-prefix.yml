name: Test stripPrefix input with Azure Pipeline download
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        name: Download artifact with explicit stripPrefix
        uses: .
        with:
          repository: git/git
          definitionId: '10'
          artifact: sparse
          # The default stripPrefix would be 'sparse/' - we set it explicitly
          # to test that the stripPrefix input is honored
          stripPrefix: 'sparse/'
          path: stripped-artifact
          cache: 'false'
        continue-on-error: true

      - name: Assert artifact directory was created with stripped paths
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" = "success" ]; then
            echo "Action succeeded - checking stripped-artifact directory..."
            if [ ! -d "stripped-artifact" ]; then
              echo "FAIL: action succeeded but artifact directory not found"
              exit 1
            fi
            echo "Listing stripped-artifact directory:"
            ls -la stripped-artifact/
            FILE_COUNT=$(find stripped-artifact -type f | wc -l)
            echo "File count: $FILE_COUNT"
            if [ "$FILE_COUNT" -lt 1 ]; then
              echo "FAIL: expected at least one file in stripped-artifact"
              exit 1
            fi
            echo "PASS: $FILE_COUNT file(s) downloaded with explicit stripPrefix"
          elif [ "${{ steps.action.outcome }}" = "failure" ]; then
            echo "PASS: action failed gracefully (pipeline may have no recent builds or artifact unavailable)"
          else
            echo "FAIL: unexpected outcome: ${{ steps.action.outcome }}"
            exit 1
          fi
