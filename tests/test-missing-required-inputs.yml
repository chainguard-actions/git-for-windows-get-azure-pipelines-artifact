name: Test missing required inputs error handling
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with missing definitionId (expect failure)
        id: action-no-defid
        uses: .
        continue-on-error: true
        with:
          repository: git/git
          definitionId: ''
          cache: 'false'

      - name: Assert action failed when definitionId is empty
        env:
          OUTCOME: ${{ steps.action-no-defid.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with empty definitionId, but got outcome '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed for empty definitionId"

      - name: Run action with missing repository (expect failure)
        id: action-no-repo
        uses: .
        continue-on-error: true
        with:
          repository: ''
          definitionId: '10'
          cache: 'false'

      - name: Assert action failed when repository is empty
        env:
          OUTCOME: ${{ steps.action-no-repo.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with empty repository, but got outcome '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed for empty repository"
