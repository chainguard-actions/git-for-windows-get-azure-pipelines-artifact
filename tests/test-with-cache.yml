name: Test artifact download with cache enabled
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create output directory
        run: mkdir -p /tmp/artifact-cache-test
      - id: action
        uses: .
        with:
          repository: git-for-windows/git
          definitionId: '1'
          artifact: 'Git-64-bit'
          path: /tmp/artifact-cache-test
          cache: 'true'
        continue-on-error: true
      - name: Assert action ran (outcome is set)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ -z "$OUTCOME" ]; then
            echo "FAIL: action outcome was not set"
            exit 1
          fi
          echo "PASS: action ran with outcome=$OUTCOME"
