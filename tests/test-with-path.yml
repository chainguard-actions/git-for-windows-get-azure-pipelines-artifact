name: Test artifact download with path and options
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create output directory
        run: mkdir -p /tmp/artifact-path-test
      - id: action
        uses: .
        with:
          repository: git-for-windows/git
          definitionId: '1'
          path: /tmp/artifact-path-test
          cache: 'false'
          verbose: 'true'
          reasonFilter: 'all'
        continue-on-error: true
      - name: Assert action completed
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          # The action contacts Azure DevOps API; it may fail due to network
          # or no matching builds, but should not crash unexpectedly.
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action completed with outcome '$OUTCOME'"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
