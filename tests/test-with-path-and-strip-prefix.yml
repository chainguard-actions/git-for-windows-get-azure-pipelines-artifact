name: Test with path and stripPrefix options
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create output directory
        run: mkdir -p /tmp/artifact-strip-test
      - id: action
        uses: .
        with:
          repository: git-for-windows/git
          definitionId: '1'
          artifact: 'some-artifact'
          stripPrefix: 'some-artifact/'
          path: /tmp/artifact-strip-test
          verbose: 'false'
          cache: 'false'
          reasonFilter: 'all'
        continue-on-error: true
      - name: Assert action ran and output directory exists
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          # The output directory should still exist regardless of whether
          # the artifact was found (it was created before the action ran)
          if [ ! -d "/tmp/artifact-strip-test" ]; then
            echo "FAIL: output directory does not exist"
            exit 1
          fi
          echo "PASS: output directory exists, action outcome=$OUTCOME"
