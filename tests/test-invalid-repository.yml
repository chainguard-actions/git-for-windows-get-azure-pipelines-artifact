name: Test invalid repository error handling
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        name: Run action with invalid repository
        uses: .
        with:
          repository: this-org-does-not-exist-xyz123abc/this-repo-does-not-exist-xyz123abc
          definitionId: '99999'
          cache: 'false'
        continue-on-error: true

      - name: Assert action failed with invalid repository
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid repository, but outcome was ${{ steps.action.outcome }}"
            exit 1
          fi
          echo "PASS: action correctly failed with invalid repository"
