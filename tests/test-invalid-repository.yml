name: Test invalid repository error handling
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with invalid repository (expect failure)
        id: action
        uses: .
        continue-on-error: true
        with:
          repository: this-org-does-not-exist-xyz123/this-repo-does-not-exist-xyz123
          definitionId: '99999'
          artifact: nonexistent-artifact
          cache: 'false'

      - name: Assert action failed with invalid repository
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid repository, but got outcome '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed for invalid repository"
